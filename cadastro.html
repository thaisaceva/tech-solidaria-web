<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cadastre-se para ser doador ou voluntário na ONG Tech Solidária.">
    <title>Cadastro | ONG Tech Solidária</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <img src="assets/img/logo-tech-solidaria.svg" alt="Logotipo ONG Tech Solidária" width="200" height="40">
        <nav aria-label="Navegação Principal">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="projetos.html">Projetos</a></li>
                <li><a href="cadastro.html" aria-current="page">Cadastro</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section aria-labelledby="t-cad">
            <h1 id="t-cad">Formulário de Cadastro</h1>
            <form action="#" method="post">
                <fieldset>
                    <legend>Dados Pessoais</legend>
                    <p>
                        <label for="nome">Nome Completo:</label><br>
                        <input type="text" id="nome" name="nome" required minlength="3" pattern="[A-Za-zÀ-ÿ\s]+">
                    </p>
                    <p>
                        <label for="email">E-mail:</label><br>
                        <input type="email" id="email" name="email" required>
                    </p>
                    <p>
                        <label for="cpf">CPF:</label><br>
                        <input type="text" id="cpf" name="cpf" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="000.000.000-00" maxlength="14">
                    </p>
                    <p>
                        <label for="telefone">Telefone:</label><br>
                        <input type="tel" id="telefone" name="telefone" required pattern="\(\d{2}\)\s\d{4,5}-\d{4}" placeholder="(61) 99999-9999" maxlength="15">
                    </p>
                </fieldset>
                <fieldset>
                    <legend>Endereço</legend>
                    <p>
                        <label for="cep">CEP:</label><br>
                        <input type="text" id="cep" name="cep" required pattern="\d{5}-\d{3}" placeholder="70000-000" maxlength="9">
                    </p>
                </fieldset>
                <fieldset>
                    <legend>Como Deseja Ajudar?</legend>
                    <p>
                        <input type="radio" id="doador" name="perfil" value="doador" required>
                        <label for="doador">Doador de Hardware</label><br>
                        <input type="radio" id="voluntario" name="perfil" value="voluntario">
                        <label for="voluntario">Voluntário</label>
                    </p>
                </fieldset>
                <p>
                    <button type="submit">Enviar</button>
                </p>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 ONG Tech Solidária.</p>
    </footer>
</body>
</html>
